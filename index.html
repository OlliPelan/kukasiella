<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salainen Juhlavieras</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }


        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            padding: 3rem 2rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }


        .btn-gold {
            background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728, #FBF5B7);
            color: #1a1a1a;
            font-weight: bold;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
        }


        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
            color: #000;
        }


        /* Yksittäisen nimirivin tyylitys */
        .name-part {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem; /* Hieman pienennetty, jotta 3 riviä mahtuu hyvin */
            line-height: 1.1;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(#BF953F, #FCF6BA, #B38728);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 10px rgba(255, 215, 0, 0.2);
            display: none; /* Piilotettu oletuksena */
            animation: popIn 1s cubic-bezier(0.26, 0.53, 0.74, 1.48);
        }


        .form-control:focus {
            border-color: #BF953F;
            box-shadow: 0 0 0 0.25rem rgba(191, 149, 63, 0.25);
        }


        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }


        #errorMessage {
            display: none;
        }
    </style>
</head>
<body>


    <div class="glass-card">
        <div id="introSection">
            <h2 class="mb-4 fw-bold">Tervetuloa ninmijuhliin!</h2>
            <p class="mb-4 text-light opacity-75">Syötä taikasana nähdäksesi kuka kätkeytyy verhon taakse.</p>
            
            <div class="mb-3">
                <input type="password" id="passwordInput" class="form-control form-control-lg text-center" placeholder="Salasana...">
            </div>
            
            <button class="btn btn-gold btn-lg w-100 rounded-pill" onclick="checkPassword()">Paljasta Nimi</button>
            
            <div id="errorMessage" class="alert alert-danger mt-3 rounded-pill py-2" role="alert">
                Väärä salasana, yritä uudelleen!
            </div>
        </div>


        <!-- TÄHÄN TULEE PALJASTUVA NIMI KOLMESSA OSASSA -->
        <div id="nameContainer" class="mt-2">
            <div id="namePart1" class="name-part">eka</div>
            <div id="namePart2" class="name-part">toka</div>
            <div id="namePart3" class="name-part">Korpela</div>
        </div>
        
        <p id="successMessage" class="mt-4 fw-bold text-light" style="display: none;">Tervetuloa juhliin! 🎉</p>
    </div>


    <script>
        function checkPassword() {
            const pwd = document.getElementById('passwordInput').value.toLowerCase().trim();
            const error = document.getElementById('errorMessage');
            const intro = document.getElementById('introSection');
            const successMsg = document.getElementById('successMessage');
            
            if (pwd === "kyöstikalevikustaa") {
                // Piilotetaan alkuvalikko
                intro.style.display = "none";
                
                // 1. Osa: Näytetään heti
                document.getElementById('namePart1').style.display = "block";
                
                // 2. Osa: Näytetään 2 sekunnin (2000 ms) kuluttua
                setTimeout(() => {
                    document.getElementById('namePart2').style.display = "block";
                }, 2000);


                // 3. Osa: Näytetään 4 sekunnin (4000 ms) kuluttua
                setTimeout(() => {
                    document.getElementById('namePart3').style.display = "block";
                    successMsg.style.display = "block"; // Näytetään onnittelu
                    fireConfetti(); // Ammutaan konfetti
                }, 4000);


            } else {
                error.style.display = "block";
                setTimeout(() => {
                    error.style.display = "none";
                }, 3000);
            }
        }


        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });


        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };


            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }


            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();


                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }


                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>


</body>
</html>
